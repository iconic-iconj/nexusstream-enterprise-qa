[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
markers =
    smoke: critical path smoke tests
    regression: stable functional regression tests
    known_bug: tests documenting a confirmed defect
    slow: tests expected to take longer than normal
    ui: Playwright browser tests
    e2e: end-to-end user journey tests
