[project]
name = "nexusstream-qa"
version = "0.1.0"
description = "QA portfolio project for NexusStream"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
  "requests>=2.32.0",
  "pytest-cov>=5.0.0",
  "python-dotenv>=1.0.1",
  "playwright>=1.63.0",
  "pytest-html>=4.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra --html=reports/pytest-report.html --self-contained-html"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "playwright>=1.63.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-html>=4.0.0",
    "pytest-playwright>=0.10.0",
]



